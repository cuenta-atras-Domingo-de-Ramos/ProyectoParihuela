<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mesa - plano 3D</title>
<style>
  html, body { margin: 0; height: 100%; background: #f4f3ef; font-family: system-ui, sans-serif; }
  #info { position: fixed; top: 10px; left: 12px; font-size: 14px; color: #444; z-index: 2; }
  label { cursor: pointer; }
  #info { background: rgba(255,255,255,.88); padding: 10px 12px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.15); }
  #info h4 { margin: 8px 0 4px; font-size: 13px; }
  #info .fila { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin: 3px 0; cursor: default; }
  #info .fila input { width: 64px; padding: 2px 4px; font-size: 14px; text-align: right; }
  #info .fila span { white-space: nowrap; }
  #alternarMenu { padding: 3px 8px; font-size: 13px; cursor: pointer; margin-bottom: 6px; }
  #info.oculto { padding: 6px; }
  #info.oculto #contenido { display: none; }
  #info.oculto #alternarMenu { margin-bottom: 0; }
  canvas { display: block; }
</style>
</head>
<body>
<div id="info">
  <button id="alternarMenu" type="button" title="Ocultar o mostrar el menú">☰ Menú</button>
  <div id="contenido">
  <label><input type="checkbox" id="patas" checked> Patas puestas</label><br>
  <label><input type="checkbox" id="medidas" checked> Mostrar medidas</label><br>
  <label><input type="checkbox" id="vestir" checked> Mesa vestida</label><br>
  <h4>Medidas (cm)</h4>
  <label class="fila"><span>Largo del tablero</span><input type="number" min="20" step="1" data-m="tableroLargo"></label>
  <label class="fila"><span>Ancho del tablero</span><input type="number" min="20" step="1" data-m="tableroAncho"></label>
  <label class="fila"><span>Alto de las patas</span><input type="number" min="20" step="1" data-m="patasAlto"></label>
  <label class="fila"><span>Viga larga</span><input type="number" min="20" step="1" data-m="vigaLargo"></label>
  <label class="fila"><span>Separación viga-marco</span><input type="number" min="0" step="1" data-m="vigaSeparacion"></label>
  <label class="fila"><span>Tela: altura sobre el suelo</span><input type="number" min="0" step="1" data-m="faldonSuelo"></label>
  <div style="font-size:12px;color:#666">Tela a 0 = llega hasta el suelo</div>
  <div style="font-size:12px;color:#666;margin-top:4px">Las medidas se guardan solas en este navegador</div>
  <button id="restablecer" type="button" style="margin-top:6px;padding:3px 8px;font-size:12px;cursor:pointer">Restablecer medidas</button>
  <h4>Objetos escaneados (.glb)</h4>
  <button id="objAnadir" type="button">Añadir objeto…</button>
  <input type="file" id="objArchivo" accept=".glb" multiple hidden>
  <div id="objEstado" style="font-size:12px;color:#666;margin-top:3px"></div>
  <div id="objPanel" style="display:none">
    <select id="objLista" style="width:100%;margin:4px 0"></select>
    <label class="fila"><span>Tamaño (lado mayor, cm)</span><input type="number" min="0.5" step="0.5" data-o="tamano"></label>
    <label class="fila"><span>Anchura (cm)</span><input type="number" min="0.5" step="0.5" id="objAnchura"></label>
    <button id="objAnchuraReset" type="button" style="margin:2px 0 4px;padding:3px 8px;font-size:12px;cursor:pointer">Restablecer anchura</button>
    <label class="fila"><span>Posición X (cm)</span><input type="number" step="1" data-o="x"></label>
    <label class="fila"><span>Posición Z (cm)</span><input type="number" step="1" data-o="z"></label>
    <label class="fila"><span>Giro (°)</span><input type="number" step="5" data-o="giro"></label>
    <label class="fila"><span>Elevación (cm)</span><input type="number" step="1" data-o="elev"></label>
    <button id="objBorrar" type="button" style="margin-top:4px">Eliminar objeto</button>
    <div style="font-size:12px;color:#666;margin-top:3px">También puedes arrastrarlo con el ratón sobre la mesa</div>
  </div>
  <div style="margin-top:6px">Arrastra para girar, rueda para zoom</div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script>
/* ============================================================
   MEDIDAS (en cm). Cambia los numeros y guarda el archivo,
   luego recarga la pagina en el navegador.
   ============================================================ */
var MEDIDAS = {
  tableroLargo: 177,      // tablero, eje X (segun plano)
  tableroAncho: 132,      // tablero, eje Z (segun plano)
  tableroGrosor: 3,       // grosor del tablero (no aparece en el plano)

  vigaLargo: 245,         // viga larga frontal (segun plano)
  vigaSeparacion: 15,     // separacion entre la viga y el marco (supuesto, cambialo a tu gusto)
  perfilAlto: 6,          // "cuadrado de 6x4": alto (segun plano)
  perfilAncho: 4,         // "cuadrado de 6x4": ancho (segun plano)

  patasAlto: 125,         // altura de las patas (segun plano)
  patasAncho: 6,          // seccion de la pata, lado largo (supuesto: 6x4)
  patasFondo: 4,          // seccion de la pata, lado corto (supuesto: 6x4)
  patasX: 80,             // distancia de las patas al centro en X
  patasZ: 64,             // distancia de las patas al centro en Z

  // Sistema para poner y quitar las patas: casquillo bajo el marco + pasador
  casquilloAlto: 26,      // altura del casquillo donde entra la pata (supuesto)
  casquilloAncho: 10,     // medida exterior del casquillo en X (supuesto)
  casquilloFondo: 8,      // medida exterior del casquillo en Z (supuesto)
  pasadorGrosor: 1.2,     // diametro del pasador que sujeta la pata (supuesto)
  pasadorAltura: 14,      // altura del pasador desde el final de la pata hacia abajo (supuesto)

  // Vestido de la mesa (como en la foto del paso)
  faldonSuelo: 0          // altura a la que acaba la tela respecto al suelo (0 = hasta el suelo)
};

var COLORES = { madera: 0xd9b98a, metal: 0x8a8f96 };
/* ============================================================ */

var M = MEDIDAS;

// Guardado de medidas en el navegador (localStorage)
var CLAVE_GUARDADO = 'mesa3d-medidas';
var POR_DEFECTO = JSON.parse(JSON.stringify(MEDIDAS));
try {
  var guardado = JSON.parse(localStorage.getItem(CLAVE_GUARDADO) || '{}');
  Object.keys(guardado).forEach(function (k) {
    if (k in M && typeof guardado[k] === 'number' && isFinite(guardado[k])) M[k] = guardado[k];
  });
} catch (e) {}
function guardarMedidas() {
  try { localStorage.setItem(CLAVE_GUARDADO, JSON.stringify(M)); } catch (e) {}
}

var scene = new THREE.Scene();
scene.background = new THREE.Color(0xf4f3ef);
var cam = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 1, 4000);
var ren = new THREE.WebGLRenderer({ antialias: true });
ren.setSize(innerWidth, innerHeight);
ren.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.appendChild(ren.domElement);

scene.add(new THREE.AmbientLight(0xffffff, 0.65));
var dl = new THREE.DirectionalLight(0xffffff, 0.7);
dl.position.set(200, 400, 300);
scene.add(dl);

function box(w, h, d, col, x, y, z, parent) {
  var m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshLambertMaterial({ color: col }));
  m.position.set(x, y, z);
  m.add(new THREE.LineSegments(new THREE.EdgesGeometry(m.geometry), new THREE.LineBasicMaterial({ color: 0x333333 })));
  (parent || modelo).add(m);
  return m;
}

var modelo = null, grupoPatas, grupoMedidas, vestido;
function liberar(o) {
  o.traverse(function (n) {
    if (n.geometry) n.geometry.dispose();
    if (n.material) {
      if (n.material.map) n.material.map.dispose();
      n.material.dispose();
    }
  });
}
function construir() {
  if (modelo) { scene.remove(modelo); liberar(modelo); }
  modelo = new THREE.Group();
  scene.add(modelo);
var L = M.tableroLargo, A = M.tableroAncho;
var yMarco = M.patasAlto + M.perfilAlto * 1.5;
var yTablero = M.patasAlto + M.perfilAlto * 2 + M.tableroGrosor / 2;
var zFrente = A / 2 - M.perfilAncho / 2;

// Vigas largas (una en cada lado, por fuera de la estructura, pegadas al marco)
var zViga = A / 2 + M.vigaSeparacion + M.perfilAncho / 2;
box(M.vigaLargo, M.perfilAlto, M.perfilAncho, COLORES.metal, 0, yMarco, zViga);
box(M.vigaLargo, M.perfilAlto, M.perfilAncho, COLORES.metal, 0, yMarco, -zViga);
// Uniones entre el marco y cada viga (posiciones en X, cambialas a tu gusto)
var unionesX = [-M.patasX, 0, M.patasX];
unionesX.forEach(function (x) {
  [-1, 1].forEach(function (lado) {
    box(M.perfilAncho, M.perfilAlto, M.vigaSeparacion, COLORES.metal, x, yMarco, lado * (A / 2 + M.vigaSeparacion / 2));
  });
});
// Marco bajo el tablero
box(L, M.perfilAlto, M.perfilAncho, COLORES.metal, 0, yMarco, zFrente);
box(L, M.perfilAlto, M.perfilAncho, COLORES.metal, 0, yMarco, -zFrente);
box(M.perfilAncho, M.perfilAlto, A - 2 * M.perfilAncho, COLORES.metal, -(L / 2 - M.perfilAncho / 2), yMarco, 0);
box(M.perfilAncho, M.perfilAlto, A - 2 * M.perfilAncho, COLORES.metal, (L / 2 - M.perfilAncho / 2), yMarco, 0);
// Tablero
box(L, M.tableroGrosor, A, COLORES.madera, 0, yTablero, 0);
// Patas desmontables: casquillos fijos al marco, patas y pasadores que se quitan
grupoPatas = new THREE.Group();
modelo.add(grupoPatas);
var yBajoMarco = yMarco - M.perfilAlto / 2;            // cara inferior del marco
var yCasquillo = yBajoMarco - M.casquilloAlto / 2;
var matPasador = new THREE.MeshLambertMaterial({ color: 0xd4a02a });
[[-1, 1], [1, 1], [-1, -1], [1, -1]].forEach(function (p) {
  var x = p[0] * M.patasX, z = p[1] * M.patasZ;
  // casquillo (fijo)
  box(M.casquilloAncho, M.casquilloAlto, M.casquilloFondo, COLORES.metal, x, yCasquillo, z);
  // pata (se quita)
  box(M.patasAncho, M.patasAlto, M.patasFondo, COLORES.metal, x, M.patasAlto / 2, z, grupoPatas);
  // pasador (se quita)
  var pas = new THREE.Mesh(
    new THREE.CylinderGeometry(M.pasadorGrosor / 2, M.pasadorGrosor / 2, M.casquilloAncho + 4, 16),
    matPasador
  );
  pas.rotation.z = Math.PI / 2;
  pas.position.set(x, M.patasAlto - M.pasadorAltura / 2, z);
  grupoPatas.add(pas);
});

// Medidas escritas sobre el modelo (se actualizan solas con los valores de MEDIDAS)
grupoMedidas = new THREE.Group();
modelo.add(grupoMedidas);
function etiqueta(texto, x, y, z) {
  var c = document.createElement('canvas');
  c.width = 320; c.height = 72;
  var g = c.getContext('2d');
  g.fillStyle = 'rgba(255,255,255,0.92)';
  g.fillRect(0, 0, 320, 72);
  g.strokeStyle = '#b3261e';
  g.lineWidth = 3;
  g.strokeRect(1.5, 1.5, 317, 69);
  g.fillStyle = '#b3261e';
  var tam = 40;
  g.font = 'bold ' + tam + 'px sans-serif';
  while (g.measureText(texto).width > 300 && tam > 14) { tam -= 2; g.font = 'bold ' + tam + 'px sans-serif'; }
  g.textAlign = 'center';
  g.textBaseline = 'middle';
  g.fillText(texto, 160, 38);
  var sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), depthTest: false }));
  sp.scale.set(64, 14.4, 1);
  sp.position.set(x, y, z);
  sp.renderOrder = 10;
  grupoMedidas.add(sp);
}
function cota(a, b, texto, off) {
  var mat = new THREE.LineBasicMaterial({ color: 0xb3261e, depthTest: false });
  var pts = [a, b];
  var l = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), mat);
  l.renderOrder = 9;
  grupoMedidas.add(l);
  [a, b].forEach(function (p) {
    var t = new THREE.Line(new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(p.x - off.x, p.y - off.y, p.z - off.z),
      new THREE.Vector3(p.x + off.x, p.y + off.y, p.z + off.z)
    ]), mat);
    t.renderOrder = 9;
    grupoMedidas.add(t);
  });
  var m = a.clone().add(b).multiplyScalar(0.5);
  etiqueta(texto, m.x, m.y + 9, m.z);
}
var yTope = yTablero + M.tableroGrosor / 2;
var V = function (x, y, z) { return new THREE.Vector3(x, y, z); };
// Largo del tablero
cota(V(-L / 2, yTope + 6, A / 2 + 6), V(L / 2, yTope + 6, A / 2 + 6), L + ' cm', V(0, 4, 0));
// Ancho del tablero
cota(V(L / 2 + 8, yTope + 6, -A / 2), V(L / 2 + 8, yTope + 6, A / 2), A + ' cm', V(0, 4, 0));
// Viga larga
cota(V(-M.vigaLargo / 2, yMarco - 14, zViga), V(M.vigaLargo / 2, yMarco - 14, zViga), M.vigaLargo + ' cm', V(0, 4, 0));
// Ancho total de un brazo (viga) a otro, de borde exterior a borde exterior
var anchoBrazos = A + 2 * (M.vigaSeparacion + M.perfilAncho);
var zBr = anchoBrazos / 2;
cota(V(M.vigaLargo / 2 + 14, yMarco, -zBr), V(M.vigaLargo / 2 + 14, yMarco, zBr), anchoBrazos + ' cm (brazo a brazo)', V(4, 0, 0));
// Altura de las patas
cota(V(M.patasX + 14, 0, M.patasZ), V(M.patasX + 14, M.patasAlto, M.patasZ), M.patasAlto + ' cm', V(4, 0, 0));
// Cuadrado del marco
etiqueta('cuadrado de ' + M.perfilAlto + 'x' + M.perfilAncho + ' cm', -L / 2 - 30, yMarco + 4, A / 2 + 4);

// Mesa vestida con telas parecidas a las de la foto del paso:
// damasco granate con dibujo y pliegues, fleco dorado colgante, galones y ribete dorado, terciopelo en el tablero
vestido = new THREE.Group();
modelo.add(vestido);

function lienzo(w, h) { var c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function aTextura(c, repX, repY) {
  var t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = 8;
  t.repeat.set(repX, repY);
  return t;
}
function flor(g, cx, cy, r, colPetalo, colCentro) {
  for (var i = 0; i < 8; i++) {
    g.save();
    g.translate(cx, cy);
    g.rotate(i * Math.PI / 4);
    g.fillStyle = colPetalo;
    g.beginPath();
    g.ellipse(0, -r * 0.55, r * 0.28, r * 0.55, 0, 0, Math.PI * 2);
    g.fill();
    g.restore();
  }
  g.fillStyle = colCentro;
  g.beginPath();
  g.arc(cx, cy, r * 0.22, 0, Math.PI * 2);
  g.fill();
}
// Damasco granate: fondo, rombos, flores, hojas y pliegue vertical
function texDamasco(repX, repY) {
  var c = lienzo(256, 256), g = c.getContext('2d');
  g.fillStyle = '#7a1223';
  g.fillRect(0, 0, 256, 256);
  g.strokeStyle = 'rgba(200,85,100,0.38)';
  g.lineWidth = 5;
  g.beginPath();
  g.moveTo(128, 0); g.lineTo(256, 128); g.lineTo(128, 256); g.lineTo(0, 128); g.closePath();
  g.stroke();
  flor(g, 128, 128, 70, 'rgba(176,52,68,0.65)', 'rgba(215,110,120,0.7)');
  [[0, 0], [256, 0], [0, 256], [256, 256]].forEach(function (p) {
    flor(g, p[0], p[1], 52, 'rgba(176,52,68,0.6)', 'rgba(215,110,120,0.65)');
  });
  g.fillStyle = 'rgba(150,35,52,0.7)';
  [[64, 64], [192, 64], [64, 192], [192, 192]].forEach(function (p) {
    g.beginPath(); g.ellipse(p[0], p[1], 14, 26, Math.PI / 4, 0, Math.PI * 2); g.fill();
    g.beginPath(); g.ellipse(p[0], p[1], 14, 26, -Math.PI / 4, 0, Math.PI * 2); g.fill();
  });
  g.strokeStyle = 'rgba(0,0,0,0.05)';
  g.lineWidth = 1;
  for (var i = -256; i < 512; i += 4) { g.beginPath(); g.moveTo(i, 0); g.lineTo(i + 256, 256); g.stroke(); }
  var gr = g.createLinearGradient(0, 0, 256, 0);
  gr.addColorStop(0, 'rgba(0,0,0,0.45)');
  gr.addColorStop(0.5, 'rgba(255,190,190,0.14)');
  gr.addColorStop(1, 'rgba(0,0,0,0.45)');
  g.fillStyle = gr;
  g.fillRect(0, 0, 256, 256);
  return aTextura(c, repX, repY);
}
// Fleco dorado: cordon superior y hebras colgando
function texFleco(repX) {
  var c = lienzo(128, 128), g = c.getContext('2d');
  var tonos = ['#d8b13a', '#b8901f', '#f0cf6a', '#a8821a'];
  g.fillStyle = '#c9a227';
  g.fillRect(0, 0, 128, 24);
  g.strokeStyle = '#7a5f10';
  g.lineWidth = 2;
  for (var x = -24; x < 128; x += 8) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x + 24, 24); g.stroke(); }
  g.fillStyle = '#7a5f10';
  g.fillRect(0, 22, 128, 3);
  for (var i = 0; i < 128; i += 3) {
    g.strokeStyle = tonos[(i / 3) % 4];
    g.lineWidth = 2;
    g.beginPath();
    g.moveTo(i + 1, 25);
    g.lineTo(i + 1 + (i % 2 ? 1 : -1), 122);
    g.stroke();
    g.fillStyle = '#d8b13a';
    g.beginPath(); g.arc(i + 1, 122, 1.6, 0, Math.PI * 2); g.fill();
  }
  return aTextura(c, repX, 1);
}
// Galon dorado trenzado
function texGalon(repX) {
  var c = lienzo(64, 32), g = c.getContext('2d');
  g.fillStyle = '#c9a227';
  g.fillRect(0, 0, 64, 32);
  g.strokeStyle = '#8a6d12';
  g.lineWidth = 3;
  for (var x = -32; x < 64; x += 10) { g.beginPath(); g.moveTo(x, 32); g.lineTo(x + 32, 0); g.stroke(); }
  g.strokeStyle = '#efd070';
  g.lineWidth = 1.5;
  for (var x2 = -27; x2 < 64; x2 += 10) { g.beginPath(); g.moveTo(x2, 32); g.lineTo(x2 + 32, 0); g.stroke(); }
  g.fillStyle = '#7a5f10';
  g.fillRect(0, 0, 64, 4); g.fillRect(0, 28, 64, 4);
  return aTextura(c, repX, 1);
}
// Ribete dorado tallado (moldura)
function texRibete(repX) {
  var c = lienzo(128, 64), g = c.getContext('2d');
  g.fillStyle = '#c9a227';
  g.fillRect(0, 0, 128, 64);
  for (var i = 0; i < 4; i++) {
    g.fillStyle = '#e3bf4a';
    g.beginPath(); g.arc(16 + i * 32, 32, 14, 0, Math.PI * 2); g.fill();
    g.strokeStyle = '#7a5f10'; g.lineWidth = 2.5;
    g.beginPath(); g.arc(16 + i * 32, 32, 14, 0, Math.PI * 2); g.stroke();
    g.beginPath(); g.arc(16 + i * 32, 32, 6, 0, Math.PI * 2); g.stroke();
  }
  g.fillStyle = '#7a5f10';
  g.fillRect(0, 0, 128, 5); g.fillRect(0, 59, 128, 5);
  return aTextura(c, repX, 1);
}
// Terciopelo
function texTerciopelo() {
  var c = lienzo(128, 128), g = c.getContext('2d');
  g.fillStyle = '#6a0e1d';
  g.fillRect(0, 0, 128, 128);
  for (var i = 0; i < 900; i++) {
    g.fillStyle = 'rgba(' + (i % 2 ? '255,120,130' : '0,0,0') + ',0.07)';
    g.fillRect(Math.random() * 128, Math.random() * 128, 2, 2);
  }
  return aTextura(c, 6, 6);
}

// La tela rodea el tablero y tapa las patas con sus casquillos (no tapa las vigas laterales)
var EX = Math.max(L / 2, M.patasX + M.casquilloAncho / 2);
var EZ = Math.max(A / 2, M.patasZ + M.casquilloFondo / 2);
var yInfTablero = yTablero - M.tableroGrosor / 2;
var altoFaldon = yInfTablero - M.faldonSuelo;
var yFaldon = M.faldonSuelo + altoFaldon / 2;
var zf = EZ + 1.5, xf = EX + 1.5;
var altoFleco = 12;

function plano(ancho, alto, tex, x, y, z, giroY, conAlfa) {
  var mat = new THREE.MeshLambertMaterial({ map: tex, side: THREE.DoubleSide, transparent: !!conAlfa, alphaTest: conAlfa ? 0.3 : 0 });
  var m = new THREE.Mesh(new THREE.PlaneGeometry(ancho, alto), mat);
  m.position.set(x, y, z);
  m.rotation.y = giroY;
  vestido.add(m);
  return m;
}
function cuatroLados(alto, y, desplazamiento, fabricaTextura, conAlfa) {
  var lados = [
    { w: 2 * EX + 3, x: 0, z: zf + desplazamiento, r: 0 },
    { w: 2 * EX + 3, x: 0, z: -(zf + desplazamiento), r: Math.PI },
    { w: 2 * EZ + 3, x: xf + desplazamiento, z: 0, r: Math.PI / 2 },
    { w: 2 * EZ + 3, x: -(xf + desplazamiento), z: 0, r: -Math.PI / 2 }
  ];
  lados.forEach(function (l) { plano(l.w, alto, fabricaTextura(l.w), l.x, y, l.z, l.r, conAlfa); });
}
// Faldon de damasco granate
cuatroLados(altoFaldon, yFaldon, 0, function (w) { return texDamasco(w / 42, altoFaldon / 42); }, false);
// Fleco dorado colgando bajo el tablero
cuatroLados(altoFleco, yInfTablero - altoFleco / 2, 0.3, function (w) { return texFleco(w / 16); }, true);
// Galon dorado fino bajo el fleco y galon cerca del suelo
cuatroLados(3, yInfTablero - altoFleco - 3, 0.2, function (w) { return texGalon(w / 6); }, false);
cuatroLados(4, M.faldonSuelo + 10, 0.2, function (w) { return texGalon(w / 6); }, false);

// Ribete dorado alrededor del borde del tablero
function ribete(w, h, d, x, y, z, rep) {
  var mat = new THREE.MeshLambertMaterial({ map: texRibete(rep) });
  var m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z);
  vestido.add(m);
}
[-1, 1].forEach(function (k) {
  ribete(L + 5, 5, 3, 0, yTope + 2.5, k * (A / 2 + 0.5), (L + 5) / 8);
  ribete(3, 5, A + 5, k * (L / 2 + 0.5), yTope + 2.5, 0, (A + 5) / 8);
});
// Tapete de terciopelo sobre el tablero
var tapete = new THREE.Mesh(
  new THREE.PlaneGeometry(L - 4, A - 4),
  new THREE.MeshLambertMaterial({ map: texTerciopelo() })
);
tapete.rotation.x = -Math.PI / 2;
tapete.position.set(0, yTope + 0.5, 0);
vestido.add(tapete);

// Linea dorada vertical en cada esquina de la tela, de arriba abajo
var oroLinea = new THREE.MeshLambertMaterial({ color: 0xc9a227 });
[[-1, -1], [1, -1], [-1, 1], [1, 1]].forEach(function (c) {
  var linea = new THREE.Mesh(new THREE.BoxGeometry(2.4, altoFaldon, 2.4), oroLinea);
  linea.position.set(c[0] * (xf + 0.3), yFaldon, c[1] * (zf + 0.3));
  vestido.add(linea);
});

// Brazos laterales (vigas) y sus uniones forrados con tela roja
function forroRojo(w, h, d, x, y, z) {
  var m = new THREE.Mesh(
    new THREE.BoxGeometry(w, h, d),
    new THREE.MeshLambertMaterial({ map: texTerciopelo() })
  );
  m.position.set(x, y, z);
  vestido.add(m);
}
var forro = 0.8; // grosor de la tela alrededor del perfil
[-1, 1].forEach(function (lado) {
  forroRojo(M.vigaLargo + forro * 2, M.perfilAlto + forro * 2, M.perfilAncho + forro * 2, 0, yMarco, lado * zViga);
  unionesX.forEach(function (x) {
    forroRojo(M.perfilAncho + forro * 2, M.perfilAlto + forro * 2, M.vigaSeparacion, x, yMarco, lado * (A / 2 + M.vigaSeparacion / 2));
  });
});

  grupoPatas.visible = document.getElementById('patas').checked;
  grupoMedidas.visible = document.getElementById('medidas').checked;
  vestido.visible = document.getElementById('vestir').checked;
}
construir();

scene.add(new THREE.GridHelper(600, 24, 0x999999, 0xcccccc));

// Camara orbital
var th = -0.7, ph = 1.15, r = 620, tgt = new THREE.Vector3(30, 70, 0);
function upd() {
  cam.position.set(
    tgt.x + r * Math.sin(ph) * Math.sin(th),
    tgt.y + r * Math.cos(ph),
    tgt.z + r * Math.sin(ph) * Math.cos(th)
  );
  cam.lookAt(tgt);
  ren.render(scene, cam);
}
var drag = false, lx = 0, ly = 0;
ren.domElement.addEventListener('pointerdown', function (e) { drag = true; lx = e.clientX; ly = e.clientY; });
addEventListener('pointerup', function () { drag = false; });
addEventListener('pointermove', function (e) {
  if (!drag) return;
  th -= (e.clientX - lx) * 0.008;
  ph = Math.max(0.2, Math.min(1.5, ph - (e.clientY - ly) * 0.008));
  lx = e.clientX; ly = e.clientY;
  upd();
});
ren.domElement.addEventListener('wheel', function (e) {
  e.preventDefault();
  r = Math.max(250, Math.min(1400, r + e.deltaY * 0.5));
  upd();
}, { passive: false });
addEventListener('resize', function () {
  cam.aspect = innerWidth / innerHeight;
  cam.updateProjectionMatrix();
  ren.setSize(innerWidth, innerHeight);
  upd();
});
document.getElementById('patas').addEventListener('change', function (e) {
  grupoPatas.visible = e.target.checked;
  upd();
});
document.getElementById('medidas').addEventListener('change', function (e) {
  grupoMedidas.visible = e.target.checked;
  upd();
});
document.getElementById('vestir').addEventListener('change', function (e) {
  vestido.visible = e.target.checked;
  upd();
});
document.querySelectorAll('#info input[data-m]').forEach(function (inp) {
  inp.value = M[inp.dataset.m];
  inp.addEventListener('input', function () {
    var v = parseFloat(inp.value);
    if (isNaN(v) || v < 0) return;
    if (inp.dataset.m !== 'faldonSuelo' && inp.dataset.m !== 'vigaSeparacion' && v < 20) return;
    M[inp.dataset.m] = v;
    guardarMedidas();
    construir();
    upd();
  });
});
var CLAVE_MENU = 'mesa3d-menu-oculto';
var panel = document.getElementById('info');
try { if (localStorage.getItem(CLAVE_MENU) === '1') panel.classList.add('oculto'); } catch (e) {}
document.getElementById('alternarMenu').addEventListener('click', function () {
  var oculto = panel.classList.toggle('oculto');
  try { localStorage.setItem(CLAVE_MENU, oculto ? '1' : '0'); } catch (e) {}
});
document.getElementById('restablecer').addEventListener('click', function () {
  try { localStorage.removeItem(CLAVE_GUARDADO); } catch (e) {}
  Object.keys(POR_DEFECTO).forEach(function (k) { M[k] = POR_DEFECTO[k]; });
  document.querySelectorAll('#info input[data-m]').forEach(function (inp) { inp.value = M[inp.dataset.m]; });
  construir();
  upd();
});
/* ============================================================
   OBJETOS ESCANEADOS (.glb): escala en cm, anchura, mover, girar, borrar.
   Los modelos se guardan en IndexedDB y los ajustes en localStorage.
   ============================================================ */
var objetos = [], objSel = null, selBox = null;
var grupoObjetos = new THREE.Group();
scene.add(grupoObjetos);
var CLAVE_AJ = 'mesa3d-objetos-ajustes';
var ajustes = {};
try { ajustes = JSON.parse(localStorage.getItem(CLAVE_AJ) || '{}') || {}; } catch (e) { ajustes = {}; }
function guardarAjustes(o) {
  if (o) ajustes[o.id] = { tamano: o.tamano, x: o.x, z: o.z, giro: o.giro, elev: o.elev, ax: o.ax };
  try { localStorage.setItem(CLAVE_AJ, JSON.stringify(ajustes)); } catch (e) {}
}

function abrirDB() {
  return new Promise(function (res, rej) {
    if (!window.indexedDB) { rej(new Error('Sin IndexedDB')); return; }
    var rq = indexedDB.open('mesa3d', 1);
    rq.onupgradeneeded = function () { rq.result.createObjectStore('modelos', { keyPath: 'id' }); };
    rq.onsuccess = function () { res(rq.result); };
    rq.onerror = function () { rej(rq.error); };
  });
}
function dbOp(modo, fn) {
  return abrirDB().then(function (db) {
    return new Promise(function (res, rej) {
      var tx = db.transaction('modelos', modo);
      var rq = fn(tx.objectStore('modelos'));
      tx.oncomplete = function () { res(rq && rq.result); };
      tx.onerror = tx.onabort = function () { rej(tx.error); };
    });
  });
}

function yTopeActual() { return M.patasAlto + M.perfilAlto * 2 + M.tableroGrosor; }
function aplicar(o) {
  var s = o.tamano / o.mayor;
  // En objetos redondos, la anchura se aplica por igual a X y Z
  // para conservar la forma circular. En objetos alargados solo se modifica X.
  if (o.redondo) {
    o.pivot.scale.set(s * o.ax, s, s * o.ax);
  } else {
    o.pivot.scale.set(s * o.ax, s, s);
  }
  o.pivot.rotation.y = o.giro * Math.PI / 180;
  o.pivot.position.set(o.x, yTopeActual() + 0.5 + o.elev, o.z);
  o.pivot.updateMatrixWorld(true);
  if (o === objSel && selBox) selBox.update();
}
function reposicionar() { objetos.forEach(aplicar); }

// Si cambian las medidas de la mesa, los objetos siguen apoyados sobre el tablero
var _construir = construir;
construir = function () { _construir(); reposicionar(); };

function estado(t) { document.getElementById('objEstado').textContent = t || ''; }

function crearObjeto(id, nombre, buf, aj) {
  return new Promise(function (res, rej) {
    if (!THREE.GLTFLoader) { rej(new Error('No se pudo cargar el lector de modelos (¿sin conexión?)')); return; }
    new THREE.GLTFLoader().parse(buf.slice(0), '', function (gltf) {
      var inner = gltf.scene;
      var caja = new THREE.Box3().setFromObject(inner);
      var tam = caja.getSize(new THREE.Vector3()), c = caja.getCenter(new THREE.Vector3());
      inner.position.set(-c.x, -caja.min.y, -c.z);   // centrado y apoyado en y = 0
      var pivot = new THREE.Group();
      pivot.add(inner);
      var o = {
        id: id, nombre: nombre, pivot: pivot,
        mayor: Math.max(tam.x, tam.y, tam.z) || 1,
        ancho0: tam.x || 1,                          // anchura original del modelo (eje X)
        // Considera redondo el objeto si su huella X/Z tiene proporciones similares.
        // Así, al cambiar la anchura, mantiene el diámetro circular en ambos ejes.
        redondo: Math.max(tam.x, tam.z) / Math.max(0.0001, Math.min(tam.x, tam.z)) <= 1.15,
        tamano: aj.tamano, x: aj.x, z: aj.z, giro: aj.giro, elev: aj.elev,
        ax: (typeof aj.ax === 'number' && isFinite(aj.ax) && aj.ax > 0) ? aj.ax : 1
      };
      grupoObjetos.add(pivot);
      objetos.push(o);
      aplicar(o);
      res(o);
    }, function (err) { rej(err || new Error('Modelo no válido')); });
  });
}

function soltar(o) {
  grupoObjetos.remove(o.pivot);
  o.pivot.traverse(function (n) {
    if (n.geometry) n.geometry.dispose();
    var ms = n.material ? (Array.isArray(n.material) ? n.material : [n.material]) : [];
    ms.forEach(function (m) { if (m.map) m.map.dispose(); m.dispose(); });
  });
}

function refrescarLista() {
  var sel = document.getElementById('objLista');
  sel.innerHTML = '';
  objetos.forEach(function (o, i) {
    var op = document.createElement('option');
    op.value = o.id; op.textContent = (i + 1) + '. ' + o.nombre;
    sel.appendChild(op);
  });
  document.getElementById('objPanel').style.display = objetos.length ? 'block' : 'none';
  if (objSel) sel.value = objSel.id;
}
// Anchura actual del objeto en cm (según su tamaño y su estiramiento)
function anchuraActual(o) { return o.ancho0 * (o.tamano / o.mayor) * o.ax; }
function cargarAnchura() {
  document.getElementById('objAnchura').value = objSel ? Math.round(anchuraActual(objSel) * 100) / 100 : '';
}
function cargarCampos() {
  document.querySelectorAll('#info input[data-o]').forEach(function (inp) {
    inp.value = objSel ? Math.round(objSel[inp.dataset.o] * 100) / 100 : '';
  });
  cargarAnchura();
}
function seleccionar(o) {
  objSel = o || null;
  if (selBox) { scene.remove(selBox); selBox.geometry.dispose(); selBox.material.dispose(); selBox = null; }
  if (objSel) { selBox = new THREE.BoxHelper(objSel.pivot, 0xb3261e); scene.add(selBox); }
  refrescarLista();
  cargarCampos();
  upd();
}
function porId(id) { return objetos.filter(function (o) { return o.id === id; })[0]; }

var POR_DEFECTO_OBJ = { tamano: 20, x: 0, z: 0, giro: 0, elev: 0, ax: 1 };

function anadirBuffer(nombre, buf) {
  var id = Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  return crearObjeto(id, nombre, buf, Object.assign({}, POR_DEFECTO_OBJ)).then(function (o) {
    guardarAjustes(o);
    seleccionar(o);
    return dbOp('readwrite', function (s) { return s.put({ id: id, nombre: nombre, buf: buf }); })
      .catch(function () { estado('Se añadió, pero no se pudo guardar el modelo (se perderá al recargar).'); });
  });
}
function anadirArchivo(f) {
  return f.arrayBuffer().then(function (buf) {
    return anadirBuffer(f.name.replace(/\.glb$/i, ''), buf);
  });
}

document.getElementById('objAnadir').addEventListener('click', function () {
  document.getElementById('objArchivo').click();
});
document.getElementById('objArchivo').addEventListener('change', function (e) {
  var files = Array.prototype.slice.call(e.target.files);
  e.target.value = '';
  if (!files.length) return;
  estado('Cargando…');
  files.reduce(function (p, f) {
    return p.then(function () { return anadirArchivo(f); });
  }, Promise.resolve()).then(function () {
    if (document.getElementById('objEstado').textContent === 'Cargando…') estado('');
  }).catch(function (err) {
    estado('Error: ' + (err && err.message ? err.message : 'no se pudo leer el archivo .glb'));
  });
});
document.getElementById('objLista').addEventListener('change', function (e) {
  seleccionar(porId(e.target.value));
});
document.querySelectorAll('#info input[data-o]').forEach(function (inp) {
  inp.addEventListener('input', function () {
    if (!objSel) return;
    var v = parseFloat(inp.value);
    if (isNaN(v)) return;
    if (inp.dataset.o === 'tamano' && v < 0.5) return;
    objSel[inp.dataset.o] = v;
    aplicar(objSel);
    guardarAjustes(objSel);
    if (inp.dataset.o === 'tamano') cargarAnchura();   // la anchura cambia con el tamaño
    upd();
  });
});
// Anchura: estira el objeto solo en su eje X local
document.getElementById('objAnchura').addEventListener('input', function (e) {
  if (!objSel) return;
  var v = parseFloat(e.target.value);
  if (isNaN(v) || v < 0.5) return;
  objSel.ax = v / (objSel.ancho0 * (objSel.tamano / objSel.mayor));
  aplicar(objSel);
  guardarAjustes(objSel);
  upd();
});
document.getElementById('objAnchuraReset').addEventListener('click', function () {
  if (!objSel) return;
  objSel.ax = 1;
  aplicar(objSel);
  guardarAjustes(objSel);
  cargarAnchura();
  upd();
});
function quitarObjeto(o) {
  objetos.splice(objetos.indexOf(o), 1);
  soltar(o);
  delete ajustes[o.id];
  guardarAjustes();
  dbOp('readwrite', function (s) { return s.delete(o.id); }).catch(function () {});
  if (objSel === o) objSel = null;
  seleccionar(objetos[0] || null);
}
document.getElementById('objBorrar').addEventListener('click', function () {
  if (objSel) quitarObjeto(objSel);
});

// Arrastrar un objeto con el ratón sobre la mesa
var raycaster = new THREE.Raycaster(), ndc = new THREE.Vector2();
var arrastrando = null, offArr = new THREE.Vector3(), planoArr = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
function lanzarRayo(e) {
  var r = ren.domElement.getBoundingClientRect();
  ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  raycaster.setFromCamera(ndc, cam);
}
function objetoDe(m) {
  while (m) {
    for (var i = 0; i < objetos.length; i++) if (objetos[i].pivot === m) return objetos[i];
    m = m.parent;
  }
  return null;
}
ren.domElement.addEventListener('pointerdown', function (e) {
  if (!objetos.length) return;
  lanzarRayo(e);
  var hits = raycaster.intersectObjects(grupoObjetos.children, true);
  if (!hits.length) return;
  var o = objetoDe(hits[0].object);
  if (!o) return;
  drag = false;                       // no girar la cámara mientras se arrastra el objeto
  seleccionar(o);
  planoArr.constant = -o.pivot.position.y;
  var p = new THREE.Vector3();
  if (raycaster.ray.intersectPlane(planoArr, p)) {
    offArr.set(o.x - p.x, 0, o.z - p.z);
    arrastrando = o;
  }
});
addEventListener('pointermove', function (e) {
  if (!arrastrando) return;
  lanzarRayo(e);
  var p = new THREE.Vector3();
  if (!raycaster.ray.intersectPlane(planoArr, p)) return;
  arrastrando.x = Math.round((p.x + offArr.x) * 10) / 10;
  arrastrando.z = Math.round((p.z + offArr.z) * 10) / 10;
  aplicar(arrastrando);
  cargarCampos();
  upd();
});
addEventListener('pointerup', function () {
  if (!arrastrando) return;
  guardarAjustes(arrastrando);
  arrastrando = null;
});

// Recuperar los objetos guardados (y borrar restos del antiguo jarrón de prueba, si quedaran)
dbOp('readonly', function (s) { return s.getAll(); }).then(function (lista) {
  (lista || []).forEach(function (r) {
    if (r.nombre === 'Jarrón de prueba') dbOp('readwrite', function (st) { return st.delete(r.id); }).catch(function () {});
  });
  return (lista || []).filter(function (r) { return r.nombre !== 'Jarrón de prueba'; }).reduce(function (p, r) {
    return p.then(function () {
      return crearObjeto(r.id, r.nombre, r.buf, Object.assign({}, POR_DEFECTO_OBJ, ajustes[r.id] || {}))
        .catch(function () {});
    });
  }, Promise.resolve());
}).then(function () {
  if (objetos.length) seleccionar(objetos[0]);
}).catch(function () {});

upd();
</script>
